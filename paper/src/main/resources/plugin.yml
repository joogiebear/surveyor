name: Surveyor
version: '${version}'
main: xyz.joogiebear.surveyor.paper.SurveyorPlugin
api-version: '26.2'
folia-supported: true
authors: [joogiebear]
description: Region protection and world editing for players and AI agents.
libraries:
  - org.xerial:sqlite-jdbc:3.53.4.0

commands:
  sv:
    description: Surveyor root command
    usage: /<command> <status|reload|region>

permissions:
  surveyor.admin:
    description: Run /sv status and /sv reload
    default: op
  surveyor.region.manage:
    description: Create, change and delete regions with /sv region
    default: op
  surveyor.bypass.region:
    description: Ignore region protection. Every override is written to the audit log.
    default: op
