name: Surveyor
version: '${version}'
main: xyz.joogiebear.surveyor.paper.SurveyorPlugin
api-version: '26.2'
folia-supported: true
authors: [joogiebear]
description: Region protection and world editing for players and AI agents.
libraries:
  - org.xerial:sqlite-jdbc:3.53.4.0

commands:
  sv:
    description: Surveyor root command
    usage: /<command> <status|reload|region|wand|pos1|pos2|sel|set|replace|copy|paste|undo|cancel>

permissions:
  surveyor.admin:
    description: Run /sv status and /sv reload
    default: op
  surveyor.region.manage:
    description: Create, change and delete regions with /sv region
    default: op
  surveyor.bypass.region:
    description: Ignore region protection. Every override is written to the audit log.
    default: op
  surveyor.edit.select:
    description: Use the selection wand and /sv wand, pos1, pos2 and sel
    default: op
  surveyor.edit.modify:
    description: Change blocks with /sv set and /sv replace, and cancel your own edits
    default: op
  surveyor.edit.clipboard:
    description: Copy and paste with /sv copy and /sv paste
    default: op
  surveyor.edit.undo:
    description: Undo your own edits with /sv undo
    default: op
