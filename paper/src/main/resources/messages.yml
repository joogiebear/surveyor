# MiniMessage formatting. Placeholders are written <name>.
prefix: "<gray>[<aqua>Surveyor</aqua>]</gray> "
no-permission: "<red>You do not have permission to do that."
usage: "<yellow>Usage: /<label> <status|reload|region|agent|audit|wand|pos1|pos2|sel|set|replace|copy|paste|undo|cancel>"
answer-yes: "yes"
answer-no: "no"
reload:
  success: "<green>Configuration and messages reloaded."
  failed: "<red>Reload failed, keeping the previous settings: <reason>"
  storage-changed: "<yellow>The storage settings changed. Restart the server to apply them."
  server-changed: "<yellow>The server.* settings changed. Restart the server to apply them."
status:
  mcp-listening: "listening on <address>"
  mcp-starting: "enabled in config, starting"
  mcp-failed: "not running: <reason>"
  mcp-off: "disabled in config"
  regions-not-loaded: "not loaded (region protection is not active)"
  version: "<gray>Plugin: <white><version>"
  server: "<gray>Server: <white><software> <server_version>"
  folia: "<gray>Folia: <white><folia>"
  database: "<gray>Database: <white><database>"
  regions: "<gray>Regions: <white><regions>"
  mcp: "<gray>MCP server: <white><mcp>"
  auth-failures: "<gray>Failed MCP logins: <white><failures>"
  auth-failures-none: "none since the server started"
agent:
  usage: "<yellow>Usage: /<label> agent token <create|list|revoke|scope>"
  usage-create: "<yellow>Usage: /<label> agent token create <name> [days until it expires]"
  usage-revoke: "<yellow>Usage: /<label> agent token revoke <name>"
  usage-scope: "<yellow>Usage: /<label> agent token scope <name> [worlds|box|actions|maxblocks|rate ...]  (without a setting it shows the scope)"
  usage-scope-worlds: "<yellow>Usage: /<label> agent token scope <name> worlds <world,world|none>"
  usage-scope-box: "<yellow>Usage: /<label> agent token scope <name> box <world> <x1> <y1> <z1> <x2> <y2> <z2>  (or: box clear)"
  usage-scope-actions: "<yellow>Usage: /<label> agent token scope <name> actions <action,action|none>  (tool names such as edit.set, or edit.*, or *)"
  usage-scope-number: "<yellow>Usage: /<label> agent token scope <name> <maxblocks|rate> <number|default>"
  console-create: "<red>Create tokens in game, not from the console: the console is written to the server log and the secret must never be."
  bad-name: "<red>Token names use letters, digits, _ and -, up to 32 characters."
  bad-days: "<red><value> is not a number of days between 1 and 3650."
  bad-action: "<red><value> is not a tool name or group. Use names such as edit.set, groups such as edit.*, or *."
  unknown: "<red>No token named <value>."
  already-revoked: "<yellow>Token <name> is already revoked."
  created: "<green>Created token <name>. Its secret is shown once and cannot be recovered; copy it now (click it):"
  secret: "<white><secret>"
  next: "<gray>It can do nothing yet. Scope it with /<label> agent token scope <name> ..."
  revoked: "<green>Token <name> is revoked. Its running operations were asked to stop."
  revoke-unsaved: "<red>Token <name> is revoked now, but the change could not be saved, so it would be valid again after a restart. Check the server log."
  scope-set: "<green>Scope of <name> updated."
  scope-header: "<gold>Scope of <name>"
  scope-worlds: "<gray>Worlds: <white><value>"
  scope-box: "<gray>Box: <white><value>"
  scope-actions: "<gray>Actions: <white><value>"
  scope-maxblocks: "<gray>Blocks per operation: <white><value>"
  scope-rate: "<gray>Calls per minute: <white><value>"
  list-empty: "<gray>There are no agent tokens."
  list-header: "<gray>Agent tokens (<count>):"
  list-entry: "<gray> - <white><name> <dark_gray>(<prefix>...) <gray><status>, expires <expires>"
  never: "never"
  none: "none"
  default: "default"
audit:
  usage: "<yellow>Usage: /<label> audit [token <name>] [count]"
  empty: "<gray>No audit entries."
  header: "<gray>Latest <count> audit entries, newest first:"
  entry: "<dark_gray><time> <white><actor> <gray><action> <white><target> <gray>(<result>)<reason>"
protection:
  denied: "<red>You cannot do that here (<flag> is denied)."
region:
  usage: "<yellow>Usage: /<label> region <create|delete|info|list|addmember|removemember|owner|flag|priority>"
  usage-create: "<yellow>Usage: /<label> region create <name> [<x1> <y1> <z1> <x2> <y2> <z2>] (without coordinates it uses your selection; ~ is your position; use world:name from the console)"
  usage-delete: "<yellow>Usage: /<label> region delete <name>"
  usage-info: "<yellow>Usage: /<label> region info <name>"
  usage-addmember: "<yellow>Usage: /<label> region addmember <name> <player>"
  usage-removemember: "<yellow>Usage: /<label> region removemember <name> <player>"
  usage-owner: "<yellow>Usage: /<label> region owner <name> <player>"
  usage-flag: "<yellow>Usage: /<label> region flag <name> <flag> <allow|deny|clear> [everyone|members|owners|non-members]"
  usage-priority: "<yellow>Usage: /<label> region priority <name> <number>"
  created: "<green>Created region <region>."
  deleted: "<green>Deleted region <region>."
  priority-set: "<green>Priority of <region> updated."
  member-added: "<green>Added a member to <region>."
  member-removed: "<green>Removed a member from <region>."
  owner-set: "<green>Set an owner of <region>."
  flag-set: "<green>Flag <flag> set on <region>."
  flag-cleared: "<green>Flag <flag> cleared on <region>."
  none: "none"
  list-empty: "<gray>There are no regions."
  list-header: "<gray>Regions (<count>):"
  list-entry: "<gray> - <white><name> <dark_gray>(<world>)"
  list-more: "<gray>...and <count> more."
  info:
    header: "<gold>Region <white><name> <gray>(<world>)"
    bounds: "<gray>Bounds: <white><min> <gray>to <white><max> <gray>| Priority: <white><priority>"
    owners: "<gray>Owners: <white><list>"
    members: "<gray>Members: <white><list>"
    flags: "<gray>Flags: <white><list>"
selection:
  wand-name: "<gold>Surveyor wand"
  wand-lore: "<gray>Left click: position 1. Right click: position 2."
  wand-given: "<green>You have the selection wand. Left click sets position 1, right click sets position 2."
  wand-full: "<red>Your inventory is full."
  pos1: "<green>Position 1 set to <x> <y> <z><size>."
  pos2: "<green>Position 2 set to <x> <y> <z><size>."
  info: "<gray>Selection: <white><pos1> <gray>to <white><pos2> <gray>(<white><size><gray>)"
  none: "<gray>You have no selection in this world. Use /sv wand, or /sv pos1 and /sv pos2."
  cleared: "<green>Selection cleared."
  unset: "not set"
  incomplete: "incomplete"
  usage: "<yellow>Usage: /<label> sel [clear]"
edit:
  usage-set: "<yellow>Usage: /<label> set <pattern> [strict]  (pattern: stone, or 50%stone,50%andesite)"
  usage-replace: "<yellow>Usage: /<label> replace <from> <to> [strict]  (from: stone or stone,dirt; to: a pattern)"
  usage-undo: "<yellow>Usage: /<label> undo [operationId]"
  usage-cancel: "<yellow>Usage: /<label> cancel [operationId]"
  started: "<gray>Started <kind> <white><id> <gray>(<blocks> blocks). Stop it with /sv cancel."
  done:
    set: "<green>Set <changed> blocks (<id>). Undo with /sv undo <id>."
    replace: "<green>Replaced <changed> blocks (<id>). Undo with /sv undo <id>."
    paste: "<green>Pasted <changed> blocks (<id>). Undo with /sv undo <id>."
    copy: "<green>Copied <changed> blocks to your clipboard."
    undo: "<green>Restored <changed> blocks (<id>)."
  skipped-protected: "<yellow><skipped> blocks were skipped because they are protected."
  strict-refused: "<red>Nothing was changed: <count> positions in the area are protected (strict)."
  cancel-requested: "<yellow>Cancelling <id> after the current batch. Blocks already changed can be undone."
  cancelled: "<yellow>Operation <id> was cancelled after changing <changed> blocks. Undo with /sv undo <id>."
  failed: "<red>Operation <id> failed after changing <changed> blocks. Check the server log. Undo with /sv undo <id>."
  interrupted-notice: "<yellow><count> edit operation(s) were cut off by a crash or restart: <ids>. Blocks they changed can be restored with /sv undo <id>."
  error:
    busy: "<red>Too many edits are running. Wait for one to finish or cancel one."
    stopping: "<red>The server is shutting down."
    too-large: "<red>That area is <blocks> blocks; the limit is <max> per operation."
    nothing-to-undo: "<red>You have nothing to undo."
    unknown-operation: "<red>No operation <id> is known."
    not-undoable: "<red>That operation does not change blocks, so there is nothing to undo."
    not-yours: "<red>That operation belongs to someone else."
    already-undone: "<red>That operation was already undone."
    journal-expired: "<red>The undo journal of that operation was deleted after undo.retention-days, so it can no longer be undone."
    still-running: "<red>That operation is still running. Cancel it first with /sv cancel."
    world-gone: "<red>The world of that operation is not loaded."
    nothing-running: "<red>You have no edit running."
error:
  not-loaded: "<red>Regions are not loaded yet or failed to load. Check /sv status."
  no-such-region: "<red>No region named <value>. Use world:name to name a region in another world."
  region-exists: "<red>A region with that name already exists in this world."
  token-exists: "<red>A token with that name already exists."
  region-gone: "<red>That region no longer exists."
  not-a-member: "<red>That player is not a member of the region."
  already-member: "<red>That player is already a member or owner. Use the owner subcommand to change roles."
  unknown-world: "<red>Unknown world <world>."
  unknown-player: "<red>Unknown player <value>. They must have joined this server before."
  bad-number: "<red><value> is not a whole number."
  bad-name: "<red>Region names use letters, digits, _ and -, up to 32 characters."
  bad-flag: "<red>Unknown flag <value>. Flags: build, interact, pvp, mob-spawning, entry."
  bad-value: "<red><value> is not allow, deny or clear."
  bad-audience: "<red>Unknown audience <value>. Use everyone, members, owners or non-members."
  world-required: "<red>From the console, name the region as world:name."
  relative-needs-player: "<red>Only players can use ~ coordinates."
  internal: "<red>Something went wrong. Check the server log."
  player-only: "<red>Only players can use this command."
  selection-needs-player: "<red>From the console, give the coordinates: region create world:name <x1> <y1> <z1> <x2> <y2> <z2>."
  no-selection: "<red>Select two positions first with /sv wand, or /sv pos1 and /sv pos2."
  outside-world: "<red>That area is outside the world's height."
  no-clipboard: "<red>Your clipboard is empty. Use /sv copy first."
  unknown-block: "<red>Unknown block <value>."
  pattern-empty: "<red>The pattern is empty or has an empty entry. Example: 50%stone,50%andesite"
  pattern-bad-weight: "<red>A weight must be a whole number above 0, as in 50%stone."
  pattern-mixed-weights: "<red>Give a weight to every entry or to none."
  pattern-unbalanced: "<red>Square brackets in the pattern do not match."
  mask-weight: "<red>The block list to replace cannot have weights."
